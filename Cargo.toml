[package]
name = "couch_arena"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"

# Bevy is far too slow to play in an unoptimised debug build. Optimising
# dependencies (which change rarely) while leaving our own crate cheap to
# rebuild gives playable framerates without hurting iteration speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
